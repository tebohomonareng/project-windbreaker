[env:firebeetle2_esp32e]
platform = espressif32
board = dfrobot_firebeetle2_esp32e
framework = arduino

; --- SERIAL SETTINGS ---
monitor_speed = 115200
upload_speed = 921600

; --- OTA SETTINGS ---
; When you are ready to go wireless, uncomment the line below and add your ESP's IP
; upload_protocol = espota
; upload_port = 192.168.1.XXX 

; --- LIBRARIES ---
lib_deps =
    lvgl/lvgl @ ^8.3.9
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5

build_flags = 
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH_1
    -DLV_HOR_RES_MAX=128
    -DLV_VER_RES_MAX=64 